name: Build Android Kernel for MT6895

on:
  push:
    branches: [ main, master ]   # 按需修改触发分支
  pull_request:
  workflow_dispatch:             # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-22.04        # 或 ubuntu-20.04
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0           # 获取完整历史，便于版本号

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          libssl-dev \
          bc \
          python3 \
          python3-pip \
          cpio \
          unzip \
          rsync \
          git \
          wget \
          device-tree-compiler \
          lz4 \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          libc6-dev-arm64-cross

    - name: Set up kernel build environment
      run: |
        # 如果有额外的工具链，可以下载，但通常系统自带的够用
        export CROSS_COMPILE=aarch64-linux-gnu-
        export ARCH=arm64
        # 使用仓库中已有的 build.config 来设定编译参数
        # 这里以 xaga 为例，你可以替换为其他设备名
        export BUILD_CONFIG=build.config.xiaomi.xaga
        echo "BUILD_CONFIG=${BUILD_CONFIG}" >> $GITHUB_ENV
        echo "CROSS_COMPILE=${CROSS_COMPILE}" >> $GITHUB_ENV
        echo "ARCH=${ARCH}" >> $GITHUB_ENV

    - name: Build kernel
      run: |
        # 使用 Android 内核通用的 build.sh（如果仓库中有）
        if [ -f build/build.sh ]; then
          ./build/build.sh
        else
          # 否则手动执行 make
          make ${ARCH} ${CROSS_COMPILE} ${BUILD_CONFIG}
          make ${ARCH} ${CROSS_COMPILE} -j$(nproc)
        fi
        # 生成的 Image 通常在 arch/arm64/boot/Image 或 Image.gz-dtb

    - name: Prepare boot image (if not already built)
      run: |
        # 如果你有 mkbootimg 工具，可以打包 boot.img
        # 这里需要设备对应的 dtb、dtbo 等，具体参考官方脚本
        # 若 build.sh 已经生成 boot.img，则跳过
        if [ ! -f out/boot.img ] && [ -f arch/arm64/boot/Image ]; then
          # 示例：手动打包（需要 dtb 和 ramdisk，这里仅示意）
          echo "No boot.img found, you may need to run mkbootimg manually"
        fi

    - name: Upload kernel image as artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: |
          arch/arm64/boot/Image
          arch/arm64/boot/Image.gz-dtb
          out/boot.img
          out/*.dtb
        if-no-files-found: ignore
