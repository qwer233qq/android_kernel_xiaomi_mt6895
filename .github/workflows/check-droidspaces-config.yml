name: Check Droidspaces Kernel Config

on:
  push:
    branches: [lineage-21, lineage-22.*]
    paths:
      - 'arch/arm64/configs/**'
  pull_request:
    branches: [lineage-21, lineage-22.*]
    paths:
      - 'arch/arm64/configs/**'

jobs:
  check-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Check Droidspaces required configs
        run: |
          echo "=========================================="
          echo "  Droidspaces Kernel Config Checker"
          echo "=========================================="

          REQUIRED=(
            "CONFIG_PID_NS"
            "CONFIG_IPC_NS"
            "CONFIG_DEVTMPFS"
            "CONFIG_CGROUP_DEVICE"
            "CONFIG_SYSVIPC"
            "CONFIG_POSIX_MQUEUE"
            "CONFIG_NAMESPACES"
            "CONFIG_UTS_NS"
            "CONFIG_MNT_NS"
            "CONFIG_NET_NS"
            "CONFIG_VETH"
            "CONFIG_BRIDGE"
            "CONFIG_OVERLAY_FS"
            "CONFIG_SECCOMP"
            "CONFIG_SECCOMP_FILTER"
            "CONFIG_CGROUPS"
            "CONFIG_CGROUP_PIDS"
            "CONFIG_MEMCG"
          )

          DEFCONFIGS=$(find arch/arm64/configs -maxdepth 1 -name "*defconfig" 2>/dev/null)

          if [ -z "$DEFCONFIGS" ]; then
            echo "❌ No defconfigs found in arch/arm64/configs/"
            exit 1
          fi

          ALL_PASS=true

          for defconfig in $DEFCONFIGS; do
            echo ""
            echo "📄 Checking: $(basename $defconfig)"
            echo "----------------------------------------"

            MISSING=()
            for cfg in "${REQUIRED[@]}"; do
              if grep -q "^$cfg=y" "$defconfig"; then
                echo "  ✅ $cfg"
              else
                echo "  ❌ $cfg"
                MISSING+=("$cfg")
                ALL_PASS=false
              fi
            done

            if [ ${#MISSING[@]} -gt 0 ]; then
              echo ""
              echo "⚠️  Missing ${#MISSING[@]} required configs:"
              for m in "${MISSING[@]}"; do
                echo "   - $m"
              done
            fi
          done

          echo ""
          echo "=========================================="
          if [ "$ALL_PASS" = true ]; then
            echo "✅ All Droidspaces configs present!"
            exit 0
          else
            echo "❌ Some required configs are missing!"
            echo "Add them for Droidspaces container support."
            exit 1
          fi
