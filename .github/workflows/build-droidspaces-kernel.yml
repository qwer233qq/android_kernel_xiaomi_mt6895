name: Build Droidspaces Kernel for MT6895

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel branch to build'
        required: true
        default: 'lineage-21'
        type: choice
        options:
          - lineage-21
          - lineage-22.0
          - lineage-22.1
          - lineage-23.2
      apply_droidspaces_patches:
        description: 'Apply Droidspaces patches'
        required: true
        default: true
        type: boolean
      create_release:
        description: 'Create GitHub Release'
        required: true
        default: false
        type: boolean

  push:
    branches:
      - lineage-21
    paths:
      - 'arch/arm64/configs/**'
      - 'drivers/**'
      - 'kernel/**'
      - 'fs/**'
      - 'net/**'
      - '.github/workflows/**'

env:
  WORKSPACE: ${{ github.workspace }}
  KERNEL_DIR: ${{ github.workspace }}/kernel
  TOOLS_DIR: ${{ github.workspace }}/tools
  OUT_DIR: ${{ github.workspace }}/out

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ========== 1. 安装系统依赖 ==========
      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5-dev \
            libncurses5 libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev libwxgtk3.0-gtk3-dev \
            libncurses-dev python3 python3-pip \
            device-tree-compiler libfdt-dev \
            libglib2.0-dev libpixman-1-dev \
            ninja-build

      # ========== 2. 克隆工具链（Git 方式） ==========
      - name: Clone Clang toolchain (Git)
        run: |
          mkdir -p ${{ env.TOOLS_DIR }}
          cd ${{ env.TOOLS_DIR }}

          # 方式1: 克隆 LineageOS 预编译 Clang
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r450784d.git \
            clang-r450784d 2>/dev/null || true

          # 如果失败，尝试备用仓库
          if [ ! -d "clang-r450784d/bin" ]; then
            rm -rf clang-r450784d
            git clone --depth=1 \
              https://gitlab.com/ImSurajxD/clang-r450784d.git \
              clang-r450784d 2>/dev/null || true
          fi

          # 如果还是失败，使用 AOSP master 分支的 Clang
          if [ ! -d "clang-r450784d/bin" ]; then
            rm -rf clang-r450784d
            git clone --depth=1 \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
              clang-repo
            CLANG_SUBDIR=$(ls clang-repo/ | grep clang | sort | tail -1)
            mv "clang-repo/$CLANG_SUBDIR" clang-r450784d
          fi

          echo "CLANG_PATH=${{ env.TOOLS_DIR }}/clang-r450784d" >> $GITHUB_ENV
          echo "Clang path: ${{ env.TOOLS_DIR }}/clang-r450784d"
          ls -la ${{ env.TOOLS_DIR }}/clang-r450784d/bin/ | head -10

      - name: Clone GCC toolchain (Git)
        run: |
          cd ${{ env.TOOLS_DIR }}

          # aarch64-linux-android GCC 4.9
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc-aarch64 2>/dev/null || \
          git clone --depth=1 \
            https://github.com/akhilnarang/gcc-prebuilts-aarch64.git \
            gcc-aarch64

          # arm-linux-androideabi GCC 4.9
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc-arm 2>/dev/null || \
          git clone --depth=1 \
            https://github.com/akhilnarang/gcc-prebuilts-arm.git \
            gcc-arm

          echo "GCC_AARCH64_PATH=${{ env.TOOLS_DIR }}/gcc-aarch64" >> $GITHUB_ENV
          echo "GCC_ARM_PATH=${{ env.TOOLS_DIR }}/gcc-arm" >> $GITHUB_ENV

      # ========== 3. 配置 ccache ==========
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.workflow }}-${{ github.event.inputs.branch || 'lineage-21' }}
          max-size: 10G

      # ========== 4. 克隆内核源码 ==========
      - name: Clone kernel source
        uses: actions/checkout@v4
        with:
          repository: xiaomi-mediatek-devs/android_kernel_xiaomi_mt6895
          ref: ${{ github.event.inputs.branch || 'lineage-21' }}
          path: kernel
          fetch-depth: 1

      # ========== 5. 克隆 Droidspaces 补丁 ==========
      - name: Clone Droidspaces patches
        if: ${{ github.event.inputs.apply_droidspaces_patches != 'false' }}
        run: |
          cd ${{ env.WORKSPACE }}
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git droidspaces
          echo "DROIDSPACES_PATH=${{ env.WORKSPACE }}/droidspaces" >> $GITHUB_ENV

      # ========== 6. 检查并应用 Droidspaces 补丁 ==========
      - name: Apply Droidspaces patches
        if: ${{ github.event.inputs.apply_droidspaces_patches != 'false' }}
        run: |
          cd ${{ env.KERNEL_DIR }}

          echo "=== Kernel version check ==="
          head -5 Makefile

          echo ""
          echo "=== Droidspaces patches directory structure ==="
          find ${{ env.DROIDSPACES_PATH }}/Documentation/resources/kernel-patches -type f -name "*.patch" | sort

          echo ""
          echo "=== Applying Droidspaces patches ==="

          # 首先列出所有可用的补丁
          PATCH_DIR="${{ env.DROIDSPACES_PATH }}/Documentation/resources/kernel-patches"

          # 根据内核版本选择补丁
          KERNEL_MAJOR=$(grep "^VERSION = " Makefile | awk '{print $3}')
          KERNEL_PATCH=$(grep "^PATCHLEVEL = " Makefile | awk '{print $3}')
          echo "Kernel version: $KERNEL_MAJOR.$KERNEL_PATCH"

          # GKI 5.10: 应用 non-GKI 补丁（这些补丁适用于旧版内核，但可能也适用于 GKI 5.10）
          # 同时尝试应用 GKI 相关补丁
          
          # 尝试应用所有可用的补丁
          for patchfile in $(find "$PATCH_DIR" -name "*.patch" | sort); do
            echo ""
            echo "Found patch: $patchfile"
            echo "Attempting to apply..."
            if patch -p1 --dry-run < "$patchfile" 2>/dev/null; then
              echo "  ✅ Patch can be applied, applying now..."
              patch -p1 < "$patchfile"
            else
              echo "  ⚠️  Patch cannot be applied (may already be applied or incompatible), skipping"
            fi
          done

          echo ""
          echo "=== Patch application complete ==="

      # ========== 7. 修改内核配置 ==========
      - name: Enable Droidspaces kernel configs
        if: ${{ github.event.inputs.apply_droidspaces_patches != 'false' }}
        run: |
          cd ${{ env.KERNEL_DIR }}

          # 查找 GKI defconfig
          DEFCONFIG=$(find arch/arm64/configs -maxdepth 1 -name "gki_defconfig" | head -1)
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG=$(find arch/arm64/configs -maxdepth 1 -name "*defconfig" | head -1)
          fi

          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: No defconfig found!"
            ls -la arch/arm64/configs/
            exit 1
          fi

          echo "Using defconfig: $DEFCONFIG"
          echo "DEFCONFIG_PATH=$DEFCONFIG" >> $GITHUB_ENV

          # 定义 Droidspaces 必需配置
          CONFIGS=(
            "CONFIG_SYSVIPC=y"
            "CONFIG_POSIX_MQUEUE=y"
            "CONFIG_IPC_NS=y"
            "CONFIG_PID_NS=y"
            "CONFIG_DEVTMPFS=y"
            "CONFIG_CGROUP_DEVICE=y"
            "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            "CONFIG_TMPFS_POSIX_ACL=y"
            "CONFIG_TMPFS_XATTR=y"
          )

          for cfg in "${CONFIGS[@]}"; do
            KEY=$(echo "$cfg" | cut -d= -f1)
            VAL=$(echo "$cfg" | cut -d= -f2)

            if grep -q "^# $KEY is not set" "$DEFCONFIG"; then
              sed -i "s/^# $KEY is not set/$KEY=$VAL/" "$DEFCONFIG"
              echo "  ✅ Enabled: $KEY=$VAL"
            elif grep -q "^$KEY=" "$DEFCONFIG"; then
              sed -i "s/^$KEY=.*/$KEY=$VAL/" "$DEFCONFIG"
              echo "  🔄 Updated: $KEY=$VAL"
            else
              echo "$KEY=$VAL" >> "$DEFCONFIG"
              echo "  ➕ Added: $KEY=$VAL"
            fi
          done

          echo ""
          echo "=== Verifying configs ==="
          for cfg in "${CONFIGS[@]}"; do
            KEY=$(echo "$cfg" | cut -d= -f1)
            grep "^$KEY=" "$DEFCONFIG" || echo "  ⚠️  $KEY not found!"
          done

      # ========== 8. 编译内核 ==========
      - name: Build kernel
        run: |
          cd ${{ env.KERNEL_DIR }}

          # 设置环境变量
          export PATH=${{ env.CLANG_PATH }}/bin:$PATH
          export CC=clang
          export CXX=clang++
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export ARCH=arm64
          export SUBARCH=arm64

          # 添加 GCC 到 PATH（用于链接器）
          export PATH=${{ env.GCC_AARCH64_PATH }}/bin:${{ env.GCC_ARM_PATH }}/bin:$PATH

          # ccache 配置
          export CCACHE_COMPRESS=1
          export CCACHE_MAXSIZE=10G
          export CCACHE_DIR=${{ env.WORKSPACE }}/.ccache

          echo "=== Toolchain Info ==="
          clang --version | head -2
          aarch64-linux-android-gcc --version | head -1 2>/dev/null || echo "GCC linker not available"

          echo ""
          echo "=== Starting build ==="
          make clean 2>/dev/null || true

          # 使用 defconfig
          DEFCONFIG_NAME=$(basename ${{ env.DEFCONFIG_PATH }})
          make ARCH=$ARCH $DEFCONFIG_NAME

          # 编译
          make ARCH=$ARCH \
            CC="ccache clang" \
            CXX="ccache clang++" \
            AR="llvm-ar" \
            NM="llvm-nm" \
            STRIP="llvm-strip" \
            OBJCOPY="llvm-objcopy" \
            OBJDUMP="llvm-objdump" \
            READELF="llvm-readelf" \
            HOSTCC="ccache clang" \
            HOSTCXX="ccache clang++" \
            HOSTAR="llvm-ar" \
            -j$(nproc) 2>&1 | tee ${{ env.OUT_DIR }}/build.log

          # 检查输出
          mkdir -p ${{ env.OUT_DIR }}
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            cp arch/arm64/boot/Image.gz ${{ env.OUT_DIR }}/
            echo "KERNEL_IMAGE=${{ env.OUT_DIR }}/Image.gz" >> $GITHUB_ENV
            echo "✅ Image.gz built successfully"
          elif [ -f "arch/arm64/boot/Image" ]; then
            cp arch/arm64/boot/Image ${{ env.OUT_DIR }}/
            echo "KERNEL_IMAGE=${{ env.OUT_DIR }}/Image" >> $GITHUB_ENV
            echo "✅ Image built successfully"
          else
            echo "❌ Kernel image not found!"
            tail -100 ${{ env.OUT_DIR }}/build.log
            exit 1
          fi

          # 复制 DTB（如果有）
          if [ -f "arch/arm64/boot/dts/mediatek/mt6895.dtb" ]; then
            cp arch/arm64/boot/dts/mediatek/mt6895.dtb ${{ env.OUT_DIR }}/
          fi

      # ========== 9. 打包 AnyKernel3 ==========
      - name: Package AnyKernel3
        run: |
          cd ${{ env.WORKSPACE }}

          # 克隆 AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

          cd anykernel

          # 复制内核
          if [ -f "${{ env.OUT_DIR }}/Image.gz" ]; then
            cp ${{ env.OUT_DIR }}/Image.gz .
          elif [ -f "${{ env.OUT_DIR }}/Image" ]; then
            cp ${{ env.OUT_DIR }}/Image .
          fi

          # 复制 DTB
          if [ -f "${{ env.OUT_DIR }}/mt6895.dtb" ]; then
            mkdir -p dtb
            cp ${{ env.OUT_DIR }}/mt6895.dtb dtb/
          fi

          # 创建 anykernel.sh
          cat > anykernel.sh << 'AKEOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          properties() { '
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=pearl
          device.name2=pearl
          supported.versions=14
          supported.patchlevels=
          '; }

          . /tmp/anykernel/tools/ak3-core.sh;

          dump_boot;
          write_boot;
          AKEOF

          # 打包
          ZIP_NAME="Droidspaces-Kernel-MT6895-$(date +%Y%m%d)-${{ github.run_number }}.zip"
          zip -r9 ${{ env.OUT_DIR }}/$ZIP_NAME *

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "✅ Packaged: $ZIP_NAME"

      # ========== 10. 上传产物 ==========
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-mt6895-${{ github.run_number }}
          path: |
            ${{ env.OUT_DIR }}/*.zip
            ${{ env.OUT_DIR }}/Image*
            ${{ env.OUT_DIR }}/build.log
          retention-days: 30

      # ========== 11. 创建 Release ==========
      - name: Create Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: droidspaces-mt6895-${{ github.run_number }}
          name: Droidspaces Kernel MT6895 #${{ github.run_number }}
          body: |
            ## Droidspaces Kernel for Redmi Note 12T Pro (MT6895)

            **Build**: #${{ github.run_number }}
            **Branch**: ${{ github.event.inputs.branch || 'lineage-21' }}
            **Date**: $(date +%Y-%m-%d)

            ### Enabled Features
            - ✅ PID namespace
            - ✅ IPC namespace
            - ✅ devtmpfs
            - ✅ SYSVIPC / POSIX_MQUEUE
            - ✅ Droidspaces patches applied

            ### Flashing
            Flash `Droidspaces-Kernel-MT6895-*.zip` via TWRP/Recovery
          files: |
            ${{ env.OUT_DIR }}/*.zip
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
